<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sierra Paraíso Cabañas</title>
<meta name="description" content="Sierra Paraíso Cabañas — descanso y naturaleza. Sitio en construcción.">
<style>
  :root {
    --forest-900: #1b2b20;
    --forest-700: #2f4a35;
    --forest-500: #4a7455;
    --sand-100: #f7f3ec;
    --sand-50: #fbf9f5;
    --gold-500: #c9974a;
    --text-muted: #5c6b5f;
    --radius: 14px;
    --shadow: 0 8px 24px rgba(27, 43, 32, 0.12);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--sand-50);
    color: var(--forest-900);
    line-height: 1.5;
  }
  a { color: inherit; }

  header {
    padding: 4rem 1.5rem 3rem;
    text-align: center;
    background: linear-gradient(180deg, var(--forest-900), var(--forest-700));
    color: var(--sand-100);
  }
  header .eyebrow {
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-size: 0.75rem;
    color: var(--gold-500);
    font-weight: 600;
  }
  header h1 {
    margin: 0.75rem 0 0.5rem;
    font-size: clamp(2rem, 5vw, 3.25rem);
    font-weight: 700;
  }
  header p {
    max-width: 42ch;
    margin: 0 auto;
    color: #d8e3da;
    font-size: 1.05rem;
  }
  .badge {
    display: inline-block;
    margin-top: 1.5rem;
    padding: 0.5rem 1rem;
    border-radius: 999px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.18);
    font-size: 0.85rem;
    color: var(--sand-100);
  }

  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 3rem 1.5rem 4rem;
  }
  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 1rem;
  }
  .gallery figure {
    margin: 0;
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
    background: #fff;
  }
  .gallery img {
    display: block;
    width: 100%;
    height: 260px;
    object-fit: cover;
  }

  footer {
    text-align: center;
    padding: 2rem 1.5rem 3rem;
    color: var(--text-muted);
    font-size: 0.9rem;
  }

  @media (prefers-reduced-motion: no-preference) {
    .gallery figure { transition: transform 0.2s ease; }
    .gallery figure:hover { transform: translateY(-3px); }
  }
</style>
</head>
<body>
  <header>
    <p class="eyebrow">Sierra Paraíso</p>
    <h1>Cabañas</h1>
    <p>Descanso, naturaleza y tranquilidad. Estamos preparando el sitio — vuelve pronto para conocer las cabañas, servicios y reservas.</p>
    <span class="badge">Sitio en construcción</span>
  </header>

  <main>
    <section class="gallery" aria-label="Galería de fotos de las cabañas">
      <figure><img src="images/foto-1.jpg" alt="Vista de Sierra Paraíso Cabañas" loading="lazy" width="600" height="450"></figure>
      <figure><img src="images/foto-2.jpg" alt="Vista de Sierra Paraíso Cabañas" loading="lazy" width="600" height="450"></figure>
      <figure><img src="images/foto-3.jpg" alt="Vista de Sierra Paraíso Cabañas" loading="lazy" width="600" height="450"></figure>
      <figure><img src="images/foto-4.jpg" alt="Vista de Sierra Paraíso Cabañas" loading="lazy" width="600" height="450"></figure>
      <figure><img src="images/foto-5.jpg" alt="Vista de Sierra Paraíso Cabañas" loading="lazy" width="600" height="450"></figure>
      <figure><img src="images/foto-6.jpg" alt="Vista de Sierra Paraíso Cabañas" loading="lazy" width="600" height="450"></figure>
      <figure><img src="images/foto-7.jpg" alt="Vista de Sierra Paraíso Cabañas" loading="lazy" width="600" height="450"></figure>
    </section>
  </main>

  <footer>
    &copy; <span id="year"></span> Sierra Paraíso Cabañas
  </footer>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
